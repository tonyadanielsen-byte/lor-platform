<!doctype html>
<html lang="nb">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <meta name="theme-color" content="#073A39" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="LOR" />
  <meta name="application-name" content="LOR" />
  <meta name="lor-build" content="4.0.1" />
  <title>OpEx LOR – Lederoppfølgingsrunder</title>
  <link rel="manifest" href="./manifest.webmanifest?v=4.0.1" />
  <link rel="icon" href="./icons/lor-icon-192.png?v=4.0.1" type="image/png" />
  <link rel="shortcut icon" href="./icons/lor-icon-192.png?v=4.0.1" type="image/png" />
  <link rel="apple-touch-icon" sizes="192x192" href="./icons/lor-icon-192.png?v=4.0.1" />

  <link rel="stylesheet" href="./src/styles/tokens.css?v=4.0.1" />
  <link rel="stylesheet" href="./src/styles/base.css?v=4.0.1" />
  <link rel="stylesheet" href="./src/styles/v3.css?v=4.0.1" />
  <link rel="stylesheet" href="./src/styles/v31.css?v=4.0.1" />
  <link rel="stylesheet" href="./src/styles/v33.css?v=4.0.1" />
  <link rel="stylesheet" href="./src/styles/v34.css?v=4.0.1" />
  <link rel="stylesheet" href="./src/styles/v35.css?v=4.0.1" />
  <link rel="stylesheet" href="./src/styles/v36.css?v=4.0.1" />
  <link rel="stylesheet" href="./src/styles/push-v1.css?v=4.0.1" />
  <link rel="stylesheet" href="./src/styles/v4.css?v=4.0.1" />

  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
</head>
<body>
  <div id="app"></div>
  <div id="toast" class="toast" aria-live="polite"></div>

  <script type="module" src="./src/app-v4.js?v=4.0.1"></script>
  <script type="module" src="./src/push-v1.js?v=4.0.1"></script>
  <script type="module" src="./src/pwa-install.js?v=4.0.1"></script>

  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('./sw.js?v=401', { scope: './', updateViaCache: 'none' })
          .then(registration => registration.update().catch(() => {}))
          .catch(error => console.warn('[LOR V4 PWA] Service worker registration failed', error));
      });
      navigator.serviceWorker.addEventListener('controllerchange', () => {
        if (sessionStorage.getItem('lor_sw_reloaded_401')) return;
        sessionStorage.setItem('lor_sw_reloaded_401', '1');
        location.reload();
      });
    }
  </script>
</body>
</html>
