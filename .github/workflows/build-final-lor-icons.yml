name: Build final LOR icons

on:
  push:
    branches:
      - fix/final-logo-3827-clean

permissions:
  contents: write

jobs:
  build-icons:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/final-logo-3827-clean
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - run: python -m pip install pillow
      - name: Generate validated PWA icons
        run: |
          python - <<'PY'
          from PIL import Image
          src='icons/lor-approved-source-128-v3827.png'
          im=Image.open(src).convert('RGB')
          assert im.size == (128,128), im.size
          for size in (192,512):
              out=im.resize((size,size), Image.Resampling.LANCZOS)
              path=f'icons/lor-icon-{size}-v3827.png'
              out.save(path, format='PNG', optimize=True)
              chk=Image.open(path)
              chk.load()
              assert chk.size == (size,size)
              assert chk.format == 'PNG'
              print('verified', path, chk.size, chk.format)
          PY
      - name: Commit icons
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add icons/lor-icon-192-v3827.png icons/lor-icon-512-v3827.png
          git diff --cached --quiet && exit 0
          git commit -m "Generate final validated LOR icons 3.8.27 [skip ci]"
          git push
