name: Shared database rules ownership
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  no-lor-rules-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: LOR must not deploy shared RTDB rules
        run: node --test tests/shared-rules-ownership.test.cjs
