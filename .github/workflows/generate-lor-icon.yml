name: Repair LOR PWA icons

on:
  push:
    branches:
      - fix/pwa-icon-3826

permissions:
  contents: write

jobs:
  generate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/pwa-icon-3826
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Install Pillow
        run: python -m pip install pillow
      - name: Repair approved 192 PNG and build valid 512 PNG
        run: |
          python - <<'PY'
          from PIL import Image, ImageFile
          ImageFile.LOAD_TRUNCATED_IMAGES = True
          src='icons/lor-icon-192-v3819.png'
          dst192='icons/lor-icon-192-v3826.png'
          dst512='icons/lor-icon-512-v3826.png'
          im=Image.open(src).convert('RGBA')
          assert im.size == (192,192), im.size
          im.save(dst192, format='PNG', optimize=True)
          im.resize((512,512), Image.Resampling.LANCZOS).save(dst512, format='PNG', optimize=True)
          for path,size in [(dst192,(192,192)),(dst512,(512,512))]:
              check=Image.open(path)
              assert check.size == size, (path,check.size)
              assert check.format == 'PNG', (path,check.format)
              check.load()
              print('verified', path, check.size, check.format)
          PY
      - name: Commit repaired icons
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add icons/lor-icon-192-v3826.png icons/lor-icon-512-v3826.png
          git diff --cached --quiet && exit 0
          git commit -m "Repair valid LOR PWA icons [skip ci]"
          git push
