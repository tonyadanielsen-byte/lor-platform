name: Generate LOR 512 icon

on:
  push:
    branches:
      - fix/pwa-icon-3826

permissions:
  contents: write

jobs:
  generate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/pwa-icon-3826
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Install Pillow
        run: python -m pip install pillow
      - name: Build exact 512 PNG from approved 192 PNG
        run: |
          python - <<'PY'
          from PIL import Image
          src='icons/lor-icon-192-v3819.png'
          dst='icons/lor-icon-512-v3826.png'
          im=Image.open(src).convert('RGBA')
          assert im.size == (192,192), im.size
          out=im.resize((512,512), Image.Resampling.LANCZOS)
          out.save(dst, format='PNG', optimize=True)
          check=Image.open(dst)
          assert check.size == (512,512), check.size
          assert check.format == 'PNG', check.format
          print('generated', dst, check.size, check.format)
          PY
      - name: Commit generated icon
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add icons/lor-icon-512-v3826.png
          git diff --cached --quiet && exit 0
          git commit -m "Generate valid 512 LOR icon [skip ci]"
          git push
